name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install engine
        run: python -m pip install --upgrade pip && python -m pip install -e ".\engine[dev]"
      - name: Run engine tests
        working-directory: engine
        run: python -m pytest -q

  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore desktop\MinuteMate.Desktop.sln
      - name: Build
        run: dotnet build desktop\MinuteMate.Desktop.sln --no-restore -warnaserror
      - name: Test
        run: dotnet test desktop\MinuteMate.Desktop.sln --no-build --logger "console;verbosity=normal"
